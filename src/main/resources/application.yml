spring:
  application:
    name: contabilidad-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
  jackson:
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

springdoc:
  swagger-ui:
    enabled: ${PUBLIC_API_DOCS:true}
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    enabled: ${PUBLIC_API_DOCS:true}
    path: /v3/api-docs

app:
  time-zone: America/Guayaquil
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-ttl: ${JWT_TTL:PT15M}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
    login-attempts-per-minute: ${LOGIN_ATTEMPTS_PER_MINUTE:5}
    public-api-docs: ${PUBLIC_API_DOCS:true}
  integration:
    hmac-secret: ${INTEGRATION_HMAC_SECRET}
    max-clock-skew: PT5M
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    demo-data: ${DEMO_DATA:false}
    demo-password: ${DEMO_PASSWORD:}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
